{% extends 'base.html' %}

{% block title %}My Profile — Gajal Food{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="content-card">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:64px;height:64px;background:var(--primary-light);">
                    <i class="bi bi-person-fill display-6" style="color:var(--primary)"></i>
                </div>
                <div>
                    <h2 class="page-title mb-0">{{ user.username }}</h2>
                    <span class="role-badge">{{ user.get_role_display }}</span>
                </div>
            </div>
            <dl class="row mb-0">
                <dt class="col-sm-4 text-muted">Email</dt>
                <dd class="col-sm-8 fw-semibold">{{ user.email }}</dd>
                <dt class="col-sm-4 text-muted">Phone</dt>
                <dd class="col-sm-8">{{ user.phone|default:"—" }}</dd>
                <dt class="col-sm-4 text-muted">Verified</dt>
                <dd class="col-sm-8">
                    {% if user.is_verified %}
                        <span class="badge bg-success">Verified</span>
                    {% else %}
                        <span class="badge bg-warning text-dark">Pending</span>
                    {% endif %}
                </dd>
            </dl>
        </div>
    </div>
</div>
{% endblock %}
