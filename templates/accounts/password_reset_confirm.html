{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set New Password — Gajal Food{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Set New Password</h2>
                <p class="text-muted text-center">OTP sent to <strong>{{ email }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
