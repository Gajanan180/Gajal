{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Verify Email — Gajal Food{% endblock %}

{% block main_class %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center">
        <div class="empty-state-icon mx-auto"><i class="bi bi-envelope-check"></i></div>
        <h2 class="mt-3">Verify your email</h2>
        <p class="text-muted">We sent a 6-digit code to<br><strong>{{ email }}</strong></p>
        <form method="post" class="text-start mt-4">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary-custom w-100 mt-2">Verify OTP</button>
        </form>
        <a href="{% url 'accounts:resend_otp' %}" class="btn btn-link mt-2 small" style="color:var(--primary)">Resend OTP</a>
    </div>
</div>
{% endblock %}
